<script id="mf-touch">
(function(){if(window.__mfTouch)return;window.__mfTouch=1;
/* لوحة أرقام للأجهزة اللمسية: خانة MathLive تمنع لوحة مفاتيح الجهاز (inputmode=none)، فتُضاف أزرار الأرقام داخل صفحة التدريب نفسها */
var touch=(navigator.maxTouchPoints>0)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
if(!touch)return;
var st=document.createElement('style');
st.textContent='.mtools.mpad{justify-content:center;margin:2px 0 4px}.mtools.mpad .mk{min-width:46px;height:46px;font-size:22px;font-weight:700;touch-action:manipulation}@media(max-width:420px){.mtools.mpad .mk{min-width:40px}}';
document.head.appendChild(st);
var KEYS=['1','2','3','4','5','6','7','8','9','0','.','/'];
function build(){var d=document.createElement('div');d.className='mtools mpad';d.setAttribute('role','group');d.setAttribute('aria-label','أزرار الأرقام');
 KEYS.forEach(function(k){var b=document.createElement('button');b.type='button';b.className='mk';b.dataset.k=k;b.textContent=k;d.appendChild(b);});return d;}
function scan(){var ts=document.querySelectorAll('.mtools');
 for(var i=0;i<ts.length;i++){var t=ts[i];if(t.classList.contains('mpad'))continue;var n=t.nextElementSibling;if(n&&n.classList.contains('mpad'))continue;
  var box=t.parentElement;if(!box)continue;
  var mf=box.querySelector('math-field.mf:not([read-only])');if(!mf)continue;
  t.insertAdjacentElement('afterend',build());}}
var q=0;function sched(){if(q)return;q=requestAnimationFrame(function(){q=0;scan();});}
new MutationObserver(sched).observe(document.body,{childList:true,subtree:true});
scan();
})();
</script>
<script id="print-ar">
(function(){if(window.__prAr)return;window.__prAr=1;
/* ورقة الطباعة: \AR{..} و \text{عربي} لا يعرفهما MathJax في الطباعة، فتُحوَّل إلى نص عربي HTML قبل التنضيد */
var AR_RE=/\\AR\{:?([^{}]*?):?\}|\\text\{([^{}]*[؀-ۿ][^{}]*)\}/g;
var HAS=/\\AR\{|\\text\{[^{}]*[؀-ۿ]/;
function span(t){return '<span dir="rtl" style="unicode-bidi:isolate">'+t+'</span>';}
function mathPart(s){s=s.replace(/^(\s|\\[;,!: ]|\\q?quad)+|(\s|\\[;,!: ]|\\q?quad)+$/g,'');return s?'\\(\\displaystyle '+s+'\\)':'';}
function conv(inner){var out='',last=0,m;AR_RE.lastIndex=0;
 while((m=AR_RE.exec(inner))){out+=mathPart(inner.slice(last,m.index))+' '+span(m[0].indexOf('\\AR')===0?m[1]:m[2])+' ';last=AR_RE.lastIndex;}
 return out+mathPart(inner.slice(last));}
function fixHtml(h){return h.replace(/\\\(\\displaystyle ([\s\S]*?)\\\)/g,function(a,inner){return HAS.test(inner)?conv(inner):a;});}
window.__prArFix=fixHtml;
function hook(){var mj=window.MathJax;if(!mj||!mj.typesetPromise||mj.__arw)return false;
 var o=mj.typesetPromise.bind(mj);mj.__arw=1;
 mj.typesetPromise=function(els){try{(els||[]).forEach(function(e){if(e&&e.id==='tmn-print'){
  var ps=e.querySelectorAll('.tp-o span,.tp-e,.tp-f');
  for(var i=0;i<ps.length;i++){var h=ps[i].innerHTML,n=fixHtml(h);if(n!==h)ps[i].innerHTML=n;}}});}catch(x){}
  return o.apply(null,arguments);};
 return true;}
var n=0,t=setInterval(function(){if(hook()||++n>200)clearInterval(t);},100);
})();
</script>
<script id="print-fix">
(function(){if(window.__prFix)return;window.__prFix=1;
/* طباعة «اطبع الأسئلة»: الخيارات الطويلة (معادلات عريضة) تُخرج العمودين عن عرض الورقة فيُقصّ المحتوى. تُحوَّل شبكة الخيارات إلى عمود واحد عند الحاجة قبل الطباعة */
var st=document.createElement('style');
st.textContent='#tmn-print .tp-o.one{grid-template-columns:minmax(0,1fr)}#tmn-print .tp-o>div{min-width:0}#tmn-print .tp-e,#tmn-print .tp-f{max-width:100%;overflow:visible}';
document.head.appendChild(st);
function fix(){
 var pb=document.getElementById('tmn-print');if(!pb||!pb.firstChild)return;
 var keep=pb.style.cssText;
 pb.style.cssText='display:block!important;visibility:hidden;position:absolute;left:0;top:0;width:680px';
 try{
  var os=pb.querySelectorAll('.tp-o');
  for(var i=0;i<os.length;i++){var o=os[i];o.classList.remove('one');
   if(o.scrollWidth>o.clientWidth+1)o.classList.add('one');}
 }catch(e){}
 pb.style.cssText=keep;
}
window.addEventListener('beforeprint',fix);
})();
</script>
