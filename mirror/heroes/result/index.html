<style>
:root{--navy:#1E3A6C;--ink:#0E1C3A;--gold:#D4A843;--bg:#F7F8FB;--bg2:#EEF1F7;--line:#D5DCE8;--stone:#5B6478;--red:#B3261E;--green:#1F7A4D}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:16px;line-height:1.8;overflow-x:hidden}
a{color:var(--navy)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.hero{background:var(--ink);color:#fff;padding:28px 16px 70px;text-align:center}
.mark{width:52px;height:52px;margin:0 auto 12px;border-radius:15px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:700 38px/1 'Amiri',serif}
.hero h1{font-size:28px;line-height:1.4;margin-bottom:6px}
.hero p{color:#C9D2E3;max-width:520px;margin:0 auto}
.wrap{max-width:620px;margin:-46px auto 0;padding:0 16px 32px;display:grid;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 16px;box-shadow:0 6px 18px rgba(14,28,58,.06);min-width:0}
.card h2{font-size:20px;line-height:1.5;margin-bottom:4px}
.sub{color:var(--stone);font-size:15px}
.f{display:grid;gap:8px;margin:14px 0 6px}
.lbl{font-weight:700}
input[type=text]{width:100%;font:700 22px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;direction:ltr;text-align:center;text-transform:uppercase;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
input[type=text]:focus{outline:none;border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(212,168,67,.55)}
.saved{display:flex;flex-wrap:wrap;gap:8px}
.saved button{font:700 15px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;direction:ltr;min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.saved button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.err{color:var(--red);font-size:14px;font-weight:700}
.err:empty{display:none}
.btn{display:flex;width:100%;align-items:center;justify-content:center;min-height:54px;border:0;border-radius:999px;background:var(--gold);color:var(--ink);font:inherit;font-size:18px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:#E2BC5E}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;border:1.5px solid var(--navy);color:var(--navy);font-size:16px;min-height:48px}
.badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px;background:var(--bg2);color:var(--navy);margin:6px 0 10px}
.badge.gold{background:var(--gold);color:var(--ink)}
.badge.green{background:#E5F2EB;color:var(--green)}
.facts{display:grid;gap:4px;font-size:15px;margin:8px 0 12px}
.facts b{font-weight:700}
.comment{background:var(--bg);border-inline-start:4px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:16px;margin:8px 0 14px;white-space:pre-line}
.ph{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;background:var(--bg2)}
.ph summary{cursor:pointer;font-weight:700;color:var(--navy);min-height:44px;display:flex;align-items:center}
.ph p{font-size:14px;color:var(--stone);margin:6px 0}
.ph label{display:flex;gap:8px;align-items:flex-start;font-size:15px;margin:8px 0}
.ph label input{width:20px;height:20px;flex:none;margin-top:3px;accent-color:var(--navy)}
.ph input[type=file]{width:100%;font:inherit;font-size:14px;margin:6px 0}
.ph img{width:100%;height:auto;border-radius:12px;margin:10px 0 6px}
.ph .err{color:#B3261E;font-size:14px;min-height:1em}
.cert img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);margin-bottom:10px}
.cert p{font-weight:700;text-align:center;margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.saved button.link{background:none;border:0;border-radius:0;min-height:44px;letter-spacing:0;direction:rtl;padding:6px 0;font-family:inherit;font-weight:400;font-size:14px;line-height:1.5;color:var(--stone);text-decoration:underline;cursor:pointer;align-self:flex-start}
.streak{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border:2px solid var(--gold);border-radius:14px;padding:12px 14px;margin:4px 0 14px}
.streak .sb{flex:none;width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:26px;font-weight:700}
.streak b{display:block;color:var(--gold);font-size:17px}
.streak span{font-size:14px;color:#C9D2E3}
.streak.lite{background:var(--bg2);color:var(--ink);border-color:var(--line)}
.streak.lite b{color:var(--navy)}
.streak.lite span{color:var(--stone)}
.streak.lite .sb{background:var(--navy);color:var(--gold)}
.foot{text-align:center;font-size:14px;color:var(--stone);padding:4px 16px 32px}
.foot a{font-weight:700}
[hidden]{display:none!important}
@media (min-width:600px){.hero{padding-top:40px}.card{padding:26px}}
</style>

<body>
<header class="hero">
  <div class="mark" aria-hidden="true">∫</div>
  <h1>نتيجتك في أبطال الأسبوع</h1>
  <p>ادخل برمزك الخاص الذي ظهر لك بعد إرسال الحل.</p>
</header>

<main class="wrap">
  <noscript><div class="card"><p>تحتاج هذه الصفحة إلى تفعيل الأوامر البرمجية (JavaScript) في المتصفح.</p></div></noscript>
  <section class="card" aria-labelledby="ft">
    <form id="rf" novalidate>
      <h2 id="ft">رمزك</h2>
      <div class="saved" id="saved" hidden></div>
      <div class="f">
        <label class="lbl" for="code">اكتب رمزك</label>
        <input type="text" id="code" name="code" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" aria-describedby="e-code">
        <p class="err" id="e-code" role="alert"></p>
      </div>
      <div class="hp" aria-hidden="true"><label>اترك هذا الحقل فارغاً <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn" type="submit" id="go">اعرض نتيجتي</button>
    </form>
  </section>

  <section class="card" id="res" hidden tabindex="-1" aria-live="polite"></section>

  <p class="sub" style="text-align:center"><a href="/heroes/">صفحة المسابقة</a> • <a href="/reviews/">✎ شاركنا رأيك</a></p>
</main>

<p class="foot">أكاديمية طه للرياضيات • <a href="/">tahamath.com</a></p>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var GR={'g12-general':'الثاني عشر عام','g12-advanced':'الثاني عشر متقدم','g11-general':'الحادي عشر عام','g11-advanced':'الحادي عشر متقدم'};
  var AW={first:['المركز الأول','gold'],second:['المركز الثاني','gold'],third:['المركز الثالث','gold'],complete:['حل كامل صحيح','green'],serious:['مشاركة جادة',''],received:['شكراً لمشاركتك','']};
  var fmt=new Intl.DateTimeFormat('ar-AE-u-nu-latn',{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit',timeZone:'Asia/Dubai'});
  function when(iso){try{return fmt.format(new Date(iso))}catch(e){return iso}}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function codes(){try{return JSON.parse(localStorage.getItem('heroes-codes')||'[]')}catch(e){return[]}}

  var inp=$('code'),f=$('rf');
  var l=codes();
  if(l.length){
    var s=$('saved');s.append(el('p','sub','رموز محفوظة على هذا الجهاز:'));s.style.flexDirection='column';
    var row=el('div','saved');
    l.slice(0,4).forEach(function(x){var b=el('button',null,x.code);b.type='button';b.setAttribute('aria-label','الرمز '+x.code+(x.title?' • '+x.title:''));b.onclick=function(){inp.value=x.code;f.requestSubmit?f.requestSubmit():f.dispatchEvent(new Event('submit',{cancelable:true}))};row.append(b)});
    var clr=el('button','link','امسح الرموز المحفوظة على هذا الجهاز');clr.type='button';
    clr.onclick=function(){try{localStorage.removeItem('heroes-codes')}catch(e){}s.hidden=true};
    s.append(row,clr);s.hidden=false;
  }
  inp.addEventListener('input',function(){
    var v=inp.value.replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776}).toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,8);
    inp.value=v.length>4?v.slice(0,4)+'-'+v.slice(4):v;$('e-code').textContent='';
  });

  var MSG={code:'الرمز غير صحيح. تأكد من الحروف والأرقام كما ظهرت لك.',rate:'محاولات كثيرة من هذه الشبكة؛ حاول بعد ربع ساعة.'};
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var c=inp.value.replace(/-/g,'');
    if(c.length!==8){$('e-code').textContent='يتكوّن الرمز من 8 حروف وأرقام، مثل: 7KQM-4XPT.';inp.focus();return}
    var b=$('go');b.disabled=true;b.textContent='جارٍ البحث…';
    var fd=new FormData(f);
    fetch('/heroes/api.php?a=result',{method:'POST',body:fd,headers:{'Accept':'application/json'}})
      .then(function(r){return r.json().catch(function(){return{ok:false,code:'server'}})})
      .then(function(j){if(!j||!j.ok)throw j||{};show(j)})
      .catch(function(j){$('e-code').textContent=MSG[j&&j.code]||'تعذّر الاتصال؛ تأكد من اتصالك بالإنترنت ثم أعد المحاولة.';inp.focus()})
      .then(function(){b.disabled=false;b.textContent='اعرض نتيجتي'});
  });

  function show(j){
    var r=$('res');r.replaceChildren();
    var c=j.contest||{};
    r.append(el('h2',null,'مسابقة '+c.title+' • '+(GR[c.grade]||c.gradeLabel||'')));
    var fa=el('div','facts');
    function line(a,b){var p=el('p');p.append(el('b',null,a+': '),document.createTextNode(b));fa.append(p)}
    line('الاسم',j.name);line('النسخة',j.version);line('وقت تسليمك',when(j.at));line('عدد الصور',String(j.images));
    var st=j.streak||{},sk=null,pn=st.pending?' • قيد التصحيح: '+(st.pending===1?'جولة واحدة':st.pending===2?'جولتان':st.pending+' جولات'):'';
    function card(cls,ic,h,tx){sk=el('div',cls);var d=el('div');d.append(el('b',null,h),el('span',null,tx));sk.append(el('span','sb',ic),d)}
    if(st.badge)card('streak',st.badge==='hero'?'🏆':'⭐',st.badge==='hero'?'شارة «بطل الهيكل»':'شارة «مثابر»','جولاتك المحتسبة: '+(st.roundTitles||[]).join('، ')+pn);
    else if(st.rounds===1)card('streak lite','1','جولة محتسبة واحدة: '+((st.roundTitles||[])[0]||''),'جولة جادة أخرى تمنحك شارة «مثابر»'+pn+'.');
    else if(st.pending)card('streak lite','⏳','شارات المثابرة','تُحتسب الجولة بعد إعلان نتيجتها بتقدير «مشاركة جادة» أو أعلى'+pn+'.');
    if(j.phase==='open'||j.phase==='closed'||j.phase==='late'){
      r.append(el('span','badge green','✓ وصل حلك'),fa);if(sk)r.append(sk);
      r.append(el('p','sub',j.phase==='open'
        ?'ما زال التسليم مفتوحاً حتى '+when(c.closes)+'، ويمكنك استبدال حلك بهذا الرمز من صفحة المسابقة.'
        :j.phase==='late'?'النتائج قيد الإعداد وتُعلن قريباً. ارجع إلى هذه الصفحة بالرمز نفسه لترى تعليقك وشهادتك.':'تُعلن النتائج '+(c.results?when(c.results):'قريباً')+'. ارجع إلى هذه الصفحة بالرمز نفسه لترى تعليقك وشهادتك.'));
    }else{
      var aw=AW[j.award]||AW.received;
      r.append(el('span','badge '+aw[1],aw[0]),fa);if(sk)r.append(sk);
      if(j.comment){r.append(el('p','lbl','تعليق المعلم على حلك'),el('p','comment',j.comment))}
      if(j.cert){
        var box=el('div','cert'),url=URL.createObjectURL(b64(j.cert.data,j.cert.mime));
        var ext=j.cert.mime==='application/pdf'?'pdf':(j.cert.mime==='image/png'?'png':'jpg');
        if(ext!=='pdf'){var im=new Image();im.alt='شهادتك';im.src=url;box.append(im)}
        box.append(el('p',null,'شاركها مع زملائك 🎓'));
        var row=el('div','row2'),dl=el('a','btn','حمّل الشهادة');dl.href=url;dl.download='شهادة-أبطال-الأسبوع-'+c.title.replace(/\s+/g,'-')+'.'+ext;
        row.append(dl);
        if(navigator.canShare){var sh=el('button','btn ghost','شاركها');sh.type='button';
          sh.onclick=function(){var fl=new File([b64(j.cert.data,j.cert.mime)],dl.download,{type:j.cert.mime});
            if(navigator.canShare({files:[fl]}))navigator.share({files:[fl],title:'شهادتي في أبطال الأسبوع'}).catch(function(){});else sh.hidden=true};row.append(sh)}
        else row.style.gridTemplateColumns='1fr';
        box.append(row);
        if(ext!=='pdf')box.append(photoBox(im,c));
        r.append(box);
      }else if(j.award&&j.award!=='received'){r.append(el('p','sub','تُضاف شهادتك هنا قريباً.'))}
    }
    r.hidden=false;r.focus();
    try{if(window.umami)umami.track('heroes-result',{phase:j.phase})}catch(e){}
  }
  function photoBox(cert,c){
    var d=el('details','ph');d.append(el('summary',null,'إن أحببت، أضف صورتك إلى نسخة خاصة بك'));
    d.append(el('p',null,'صورتك لا تُرفع إلى الموقع ولا تُنشر أبداً؛ تُركَّب على شهادتك داخل جهازك فقط، والنسخة لك وحدك.'));
    var lb=el('label'),ok=el('input');ok.type='checkbox';lb.append(ok,el('span',null,'أقرّ بأن ولي أمري موافق على وضع صورتي على شهادتي.'));
    var fi=el('input');fi.type='file';fi.accept='image/*';fi.setAttribute('aria-label','اختر صورتك');
    var er=el('p','err');er.setAttribute('role','status');var out=el('div'),last=null;
    d.append(lb,fi,er,out);
    fi.addEventListener('change',function(){
      er.textContent='';out.replaceChildren();if(last){URL.revokeObjectURL(last);last=null}var f=fi.files&&fi.files[0];if(!f)return;
      if(!cert.complete||!cert.naturalWidth){er.textContent='انتظر ظهور الشهادة ثم أعد المحاولة.';fi.value='';return}
      if(!ok.checked){er.textContent='ضع علامة الإقرار أولاً، ثم اختر الصورة.';fi.value='';return}
      if(!/^image\//.test(f.type)){er.textContent='اختر صورة (JPG أو PNG).';return}
      var u=URL.createObjectURL(f),p=new Image();
      p.onload=function(){
        try{
          /* موضع الدائرة مكان الكأس في قوالب كانفا 1080×1350؛ يُعدَّل إن تغيّر القالب */
          var W=cert.naturalWidth,H=cert.naturalHeight,k=W/1080,cx=540*k,cy=434*k,R=128*k;
          var cv=document.createElement('canvas');cv.width=W;cv.height=H;var g=cv.getContext('2d');
          g.drawImage(cert,0,0,W,H);
          g.beginPath();g.arc(cx,cy,R+9*k,0,Math.PI*2);g.fillStyle='#D4A843';g.fill();
          g.save();g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.clip();
          var s=Math.min(p.naturalWidth,p.naturalHeight),sx=(p.naturalWidth-s)/2,sy=(p.naturalHeight-s)/3;
          g.drawImage(p,sx,Math.max(0,sy),s,s,cx-R,cy-R,2*R,2*R);g.restore();
          URL.revokeObjectURL(u);fi.value='';
          cv.toBlob(function(b){
            if(!b){er.textContent='تعذّر تركيب الصورة على هذا الجهاز.';return}
            var bu=URL.createObjectURL(b),pi=new Image();last=bu;pi.alt='شهادتك بصورتك';pi.src=bu;
            var a=el('a','btn','حمّل النسخة التي فيها صورتي');a.href=bu;a.download='شهادتي-بصورتي-'+c.title.replace(/\s+/g,'-')+'.png';
            out.append(pi,a);
          },'image/png');
        }catch(x){URL.revokeObjectURL(u);er.textContent='تعذّر تركيب الصورة على هذا الجهاز.'}
      };
      p.onerror=function(){er.textContent='تعذّر فتح هذه الصورة؛ جرّب صورة أخرى.';URL.revokeObjectURL(u)};
      p.src=u;
    });
    return d;
  }
  function b64(d,m){var s=atob(d),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m})}
})();
</script>
