<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الصفحة غير موجودة | أكاديمية طه للرياضيات</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E3A6C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1C3A'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='serif' font-size='44' fill='%23D4A843'%3E%E2%88%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E3A6C;--ink:#0E1C3A;--gold:#D4A843;--bg:#F7F8FB;--line:#D9DEE8;--stone:#5B6478}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.8;padding:32px 16px}
.box{width:min(560px,100%);text-align:center}
.mark{width:56px;height:56px;margin:0 auto 18px;border-radius:16px;background:var(--ink);color:var(--gold);display:grid;place-items:center;font:44px/1 serif}
.code{font-size:88px;font-weight:700;line-height:1;color:var(--navy);direction:ltr}
.code span{color:var(--gold)}
h1{font-size:26px;margin:14px 0 6px}
p{color:var(--stone);font-size:17px}
.home{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 28px;margin:26px 0 30px;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:700;font-size:17px;text-decoration:none}
.home:focus-visible,.g a:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
h2{font-size:16px;color:var(--stone);font-weight:700;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g a{display:flex;align-items:center;justify-content:center;min-height:52px;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;text-decoration:none}
.g a:hover{border-color:var(--gold)}
.soon{font-size:14px;margin-top:14px}
html{background:var(--bg)}
</style>
</head>
<body>
<main class="box">
  <div class="mark" aria-hidden="true">∫</div>
  <div class="code">4<span>0</span>4</div>
  <h1>الصفحة غير موجودة</h1>
  <p>ربما تغيّر الرابط أو كُتب بشكل غير صحيح.</p>
  <a class="home" href="https://tahamath.com/">العودة إلى الرئيسية</a>
  <h2>أو اختر صفك</h2>
  <nav class="g" aria-label="الصفوف">
    <a href="https://tahamath.com/g12-general/">الثاني عشر عام</a>
    <a href="https://tahamath.com/g12-advanced/">الثاني عشر متقدم</a>
    <a href="https://tahamath.com/g11-general/">الحادي عشر عام</a>
    <a href="https://tahamath.com/g11-advanced/">الحادي عشر متقدم</a>
  </nav>
  <p class="soon">صفحات التدريب متاحة الآن للصفوف الأربعة.</p>
</main>
<script src="/nav.js?v=5" defer></script>
</body>
</html>
