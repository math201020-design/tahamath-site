      sol: [{ t: b + 'x=' + a + '\\cdot ' + c + '\\quad\\text{(cross multiply)}' }, { t: b + 'x=' + (a * c) }, { t: 'x=' + x0 }],

  }

  function showQ() {
    var q = round.qs[round.idx], stage = $('#stage');
    stage.innerHTML = '';
    stage.appendChild(h('div', q.rtl ? 'stem rtl' : 'stem', q.stem)); stage.lastChild.setAttribute('lang', q.rtl ? 'ar' : 'en');
    if (q.svg) stage.appendChild(h('div', 'fig', q.svg));
    if (q.e) stage.appendChild(h('div', 'eq', '\\[' + q.e + '\\]'));
    var opts = h('div', 'opts'); opts.setAttribute('role', 'group'); opts.setAttribute('aria-label', 'الخيارات');
    q.opts.forEach(function (o, i) {
      var b = h('button', 'opt', '<span class="L">' + LETTERS[i] + '</span><span class="m">\\(' + o.t + '\\)</span>');
      b.type = 'button'; b.setAttribute('data-i', i);
      b.addEventListener('click', function () { choose(i); });
      opts.appendChild(b);
    });
    stage.appendChild(opts);
    var tools = h('div', 'tools');
    var hb = h('button', 'btn ghost', 'إظهار التلميح'); hb.type = 'button'; hb.id = 'hintBtn';
    var hint = h('div', 'hint', q.hint); hint.id = 'hintOut'; hint.hidden = true;
    hb.addEventListener('click', function () { hint.hidden = !hint.hidden; hb.textContent = hint.hidden ? 'إظهار التلميح' : 'إخفاء التلميح'; if (!hint.hidden) round.hinted = true; });
    tools.appendChild(hb); stage.appendChild(tools); stage.appendChild(hint);
    var fb = h('div', null); fb.id = 'fb'; stage.appendChild(fb);
    typeset(stage);
  }

  function choose(i) {
    var q = round.qs[round.idx];
    if (round.answers[round.idx] != null) return;
    var ok = i === q.ans;
    round.answers[round.idx] = ok ? 1 : 0;
    if (ok) round.correct++;
    var btns = document.querySelectorAll('.opt');
    btns.forEach(function (b, k) { b.disabled = true; if (k === q.ans) b.classList.add('right'); else if (k === i) b.classList.add('wrong'); });
    $('#hintBtn').hidden = true; $('#hintOut').hidden = true;
    var fb = $('#fb'); fb.innerHTML = '';
    var box = h('div', 'fb ' + (ok ? 'ok' : 'no'));
    if (ok) {
      box.innerHTML = '✓ إجابة صحيحة.';
    } else {
      var why = q.opts[i].why ? '<span class="why">' + q.opts[i].why + '</span>' : '';
      box.innerHTML = '✗ إجابة غير صحيحة.' + why + '<span class="why">الإجابة الصحيحة:</span><span class="corr">\\(' + q.opts[q.ans].t + '\\)</span>';
    }
    fb.appendChild(box);
    var sol = h('div', 'sol', solHTML(q));
    if (ok) {
      sol.hidden = true;
      var tg = h('button', 'btn ghost', 'إظهار الحل التفصيلي'); tg.type = 'button'; tg.style.marginTop = '10px';
      tg.addEventListener('click', function () { sol.hidden = !sol.hidden; tg.textContent = sol.hidden ? 'إظهار الحل التفصيلي' : 'إخفاء الحل التفصيلي'; });
      fb.appendChild(tg);
    }
    fb.appendChild(sol);
    var last = round.idx === ROUND - 1;
    var nx = h('button', 'btn gold', last ? 'عرض نتيجة الجولة ←' : 'السؤال التالي ←'); nx.type = 'button'; nx.style.marginTop = '12px'; nx.id = 'nextBtn';
    nx.addEventListener('click', next);
    fb.appendChild(nx);
    renderDots(); typeset(fb);
    nx.focus({ preventScroll: false });
  }

  function next() {
    if (round.idx < ROUND - 1) { round.idx++; renderInfo(); renderDots(); showQ(); window.scrollTo(0, 0); return; }
    finish();
  }

  function finish() {
    var passed = round.correct >= PASS, lvl = st.level, stage = $('#stage');
    var res = h('div', 'res');
    if (round.n === 1) { st.firstScore = round.correct; persist(); }
    track('mastery-round-end', { band: BAND, level: lvl, correct: round.correct, passed: passed ? 1 : 0, n: round.n, first: round.n === 1 ? 1 : 0 });
    if (passed) {
      st.done[lvl] = true; st.fails[lvl] = 0;
      if (lvl < 4) {
        st.level = lvl + 1; persist();
        res.innerHTML = '<h2>أتقنت المستوى ' + lvl + ' ✓</h2><p>حصلت على ' + cnt(round.correct) + ' من ' + ROUND + '. انتقل الآن إلى المستوى ' + st.level + ': <b>' + LV[st.level - 1].ar + '</b>.</p>';
        var acts = h('div', 'acts'); var b1 = h('button', 'btn gold', 'ابدأ المستوى ' + st.level + ' ←'); b1.type = 'button'; b1.addEventListener('click', function () { window.scrollTo(0, 0); newRound(); }); acts.appendChild(b1); res.appendChild(acts);
      } else {
        st.mastered = true; persist();
        res.innerHTML = '<h2>أتقنت ' + BLBL + ' كاملاً ✓</h2><p>حصلت على ' + cnt(round.correct) + ' من ' + ROUND + ' في مستوى الوزارة. أحسنت. جرّب الآن نموذجاً كاملاً من صفحة الصف لتختبر نفسك كما في الاختبار.</p>';
        var a2 = h('div', 'acts');
        var l1 = h('a', 'link btn gold', 'العودة إلى صفحة الصف'); l1.href = '/' + GR + '/';
        var b2 = h('button', 'btn ghost', 'تدرّب من جديد'); b2.type = 'button';
        b2.addEventListener('click', function () { st.level = 1; st.done = {}; st.fails = {}; st.mastered = false; persist(); window.scrollTo(0, 0); newRound(); });
        a2.appendChild(l1); a2.appendChild(b2); res.appendChild(a2);
      }
    } else {
      st.fails[lvl] = (+st.fails[lvl] || 0) + 1; persist();
      var again = '<h2>لم تصل بعد إلى الإتقان</h2><p>حصلت على ' + cnt(round.correct) + ' من ' + ROUND + '، والمطلوب للإتقان ' + cnt(PASS) + ' على الأقل. لا بأس: ستتكرر الفكرة نفسها بأرقام جديدة حتى تتقنها.</p>';
      if (st.fails[lvl] >= REVIEW_AFTER) again += '<p>هذا المستوى يحتاج مزيداً من التدريب. نقترح أن تراجع الحل التفصيلي في ' + BLBL + ' ثم تعود.</p>';
      res.innerHTML = again;
      var a3 = h('div', 'acts'); var b3 = h('button', 'btn gold', 'جولة جديدة بأرقام جديدة ←'); b3.type = 'button'; b3.addEventListener('click', function () { window.scrollTo(0, 0); newRound(); }); a3.appendChild(b3);
      if (st.fails[lvl] >= REVIEW_AFTER) { var l2 = h('a', 'link btn ghost', 'راجع حل ' + BLBL); l2.href = '/' + GR + '/band-' + BAND + '/'; a3.appendChild(l2); }
      res.appendChild(a3);
    }
    stage.innerHTML = ''; stage.appendChild(res); stage.appendChild(quickPoll(lvl)); stage.appendChild(feedbackBox());
    round.idx = ROUND; renderPath(); renderDots(); $('#roundInfo').textContent = ''; typeset(stage);
    stage.setAttribute('tabindex', '-1'); stage.focus({ preventScroll: true });
  }

  /* سؤال سريع بنقرة واحدة عن صعوبة الجولة: يُسجَّل في Umami بلا نص، لمعرفة هل المستوى مناسب */
  function quickPoll(lvl) {
    var box = h('div', 'box qpoll'); box.appendChild(h('p', 'fbq', 'كيف كانت أسئلة هذه الجولة؟'));
    var row = h('div', 'acts');
    [['easy', 'سهلة'], ['fit', 'مناسبة'], ['hard', 'صعبة']].forEach(function (o) {
      var b = h('button', 'btn ghost', o[1]); b.type = 'button';
      b.addEventListener('click', function () { track('mastery-diff', { band: BAND, level: lvl, v: o[0] }); box.innerHTML = ''; box.appendChild(h('p', 'fbq', 'شكراً لك، سجّلنا رأيك')); });
      row.appendChild(b);
    });
    box.appendChild(row); return box;
  }
  /* رأي الطالب في الأداة: يُرسل إلى استقبال الآراء نفسه، ويُميَّز بمسار الصفحة، ويُراجَع قبل أي نشر */
  var FB_KEY = 'tmn-mastery-fb', t0 = Date.now();
  function fbSent() { try { return localStorage.getItem(FB_KEY) === '1'; } catch (e) { return false; } }
  function feedbackBox() {
    var box = h('details', 'box fbk');
    if (fbSent()) { box.appendChild(h('summary', null, 'شكراً لك، وصل رأيك في هذا التدريب')); return box; }
    box.appendChild(h('summary', null, 'شاركنا رأيك في هذا التدريب (اختياري)'));
    var f = h('form', 'fbf'); f.setAttribute('novalidate', '');
    f.innerHTML =
      '<p class="fbq">ما تقييمك لهذا التدريب؟</p>' +
      '<div class="stars" role="radiogroup" aria-label="التقييم من 5">' + [1,2,3,4,5].map(function (i) { return '<label><input type="radio" name="rating" value="' + i + '"><span>' + i + '</span></label>'; }).join('') + '</div>' +
      '<label class="fbl" for="fbt">هل ساعدك على فهم الفكرة؟ ما الذي أعجبك، وما الذي يحتاج إلى تحسين؟</label>' +
      '<textarea id="fbt" name="text" rows="4" maxlength="450" placeholder="اكتب رأيك هنا (10 أحرف على الأقل)"></textarea>' +
      '<label class="fbc"><input type="checkbox" name="anon" value="yes" checked> بلا اسم</label>' +
      '<div id="fbn" hidden><label class="fbl" for="fbname">الاسم الأول فقط</label><input id="fbname" name="name" maxlength="40" autocomplete="off"></div>' +
      '<label class="fbc"><input type="checkbox" name="consent" value="yes"> أوافق على نشر رأيي في صفحة الآراء بعد مراجعته</label>' +
      '<div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>' +
      '<p class="fberr" id="fberr" role="alert" hidden></p>' +
      '<button type="submit" class="btn gold">أرسل رأيي</button>';
    box.appendChild(f);
    var anon = f.querySelector('[name=anon]'), nm = f.querySelector('#fbn');
    anon.addEventListener('change', function () { nm.hidden = anon.checked; });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var err = f.querySelector('#fberr'); err.hidden = true;
      var fd = new FormData(f), rating = fd.get('rating'), text = String(fd.get('text') || '').trim();
      var m = !rating ? 'اختر تقييماً من 1 إلى 5.' : text.length < 10 ? 'اكتب رأيك بما لا يقل عن 10 أحرف.' : !fd.get('consent') ? 'لإرسال رأيك، فعّل خيار الموافقة على نشره بعد المراجعة.' : (!anon.checked && !String(fd.get('name') || '').trim()) ? 'اكتب اسمك الأول أو اختر «بلا اسم».' : '';
      if (m) { err.textContent = m; err.hidden = false; return; }
      var out = new FormData();
      out.set('grade', GR); out.set('rating', rating); out.set('consent', 'yes');
      out.set('anon', anon.checked ? 'yes' : ''); out.set('name', anon.checked ? '' : String(fd.get('name')).trim());
      out.set('website', String(fd.get('website') || '')); out.set('el', String(Date.now() - t0)); out.set('from', location.pathname);
      out.set('text', text + '\n[تدريب الإتقان: جولات ' + (st.rounds || 0) + '، مستوى ' + st.level + '، أول جولة ' + (st.firstScore == null ? '-' : st.firstScore + ' من 5') + ']');
      var btn = f.querySelector('button'); btn.disabled = true;
      fetch('/reviews/submit.php', { method: 'POST', body: out, headers: { Accept: 'application/json' } })
        .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
        .then(function (j) {
          if (j && j.ok) { try { localStorage.setItem(FB_KEY, '1'); } catch (e2) {} track('mastery-feedback', { band: BAND }); box.innerHTML = ''; box.appendChild(h('summary', null, 'شكراً لك، وصل رأيك وسيُراجَع قبل نشره')); }
          else { btn.disabled = false; err.textContent = (j && j.code === 'rate') ? 'وصلنا منك عدة آراء قبل قليل، شكراً لك. جرّب مرة أخرى بعد ساعة.' : 'تعذّر إرسال الرأي الآن، حاول مرة أخرى بعد قليل.'; err.hidden = false; }
        })
        .catch(function () { btn.disabled = false; err.textContent = 'تعذّر إرسال الرأي الآن، حاول مرة أخرى بعد قليل.'; err.hidden = false; });
    });
    return box;
  }

  newRound();
})();

</script>
